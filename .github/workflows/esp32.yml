name: esp32
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install libxml2 (needed by esp-clang)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev || true
          # esp-clang needs libxml2.so.2 at runtime; -dev ships the unversioned .so
          ln -sf /usr/lib/x86_64-linux-gnu/libxml2.so /usr/lib/x86_64-linux-gnu/libxml2.so.2
      - name: Install espup + ldproxy
        run: |
          cargo install espup --locked
          cargo install ldproxy --locked
      - name: Install ESP toolchain
        run: espup install
      - name: Cache IDF tools
        uses: actions/cache@v4
        with:
          path: hermes-lite-esp32/.embuild
          key: embuild-${{ runner.os }}-v1
      - name: Build firmware
        env:
          RUST_LOG: debug
        run: |
          source "$HOME/export-esp.sh"
          cd hermes-lite-esp32
          cargo +esp build --release 2>&1 | tail -120
