[package]
name = "hermes-lite-std"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "std platform backend (ureq+rustls) and CLI demo for hermes-lite-core"

[dependencies]
hermes-lite-core = { path = "../hermes-lite-core" }
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }
serde_json = "1"

[[bin]]
name = "hermes-lite"
path = "src/main.rs"
